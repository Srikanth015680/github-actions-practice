services:
  backend:
    build: ./backend
    container_name: shopflow-backend
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    restart: unless-stopped
  frontend:
    build: ./frontend
    container_name: shopflow-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

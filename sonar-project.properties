```properties
# Project identification
sonar.projectKey=shopflow-fullstack
sonar.projectName=ShopFlow Full Stack
sonar.projectVersion=1.0

# Source directories
sonar.sources=backend/src,frontend/src

# Test directories
sonar.tests=backend/tests,frontend/src

# JavaScript and TypeScript files
sonar.javascript.file.suffixes=.js,.jsx,.mjs,.cjs
sonar.typescript.file.suffixes=.ts,.tsx

# Exclude dependencies and generated files
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Test file patterns
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.test.jsx,**/*.spec.jsx,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
